<!-- ===== LIEN ADMIN ===== -->
@if (showAdminLink) {
<div class="py-3 flex justify-center" [class]="dark ? 'border-t border-white/10' : 'bg-white border-t border-gray-100'">
  <a
    href="/admin"
    class="inline-flex items-center gap-1.5 text-xs transition-colors"
    [class]="dark ? 'text-gray-500 hover:text-gray-300' : 'text-gray-400 hover:text-gray-600'"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
    </svg>
    Accès administration
  </a>
</div>
}

<!-- ===== BANDEAU VIBE CODING ===== -->
<footer class="py-4" [class]="dark ? 'border-t border-white/10' : 'bg-white border-t border-gray-100'">
  <div class="container-app flex flex-col sm:flex-row items-center justify-center gap-2 text-xs" [class]="dark ? 'text-gray-500' : 'text-gray-400'">
    <span>Cette application a été développée en</span>
    <span
      class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full font-medium"
      [class]="dark ? 'bg-violet-900/40 text-violet-300 border border-violet-700/40' : 'bg-violet-50 text-violet-600 border border-violet-100'"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09Z" />
      </svg>
      vibe coding
    </span>
    <span>avec</span>
    <a
      href="https://claude.ai/claude-code"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center gap-1 font-medium transition-colors"
      [class]="dark ? 'text-gray-400 hover:text-gray-200' : 'text-gray-500 hover:text-gray-700'"
    >
      Claude Code
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
      </svg>
    </a>
    <span>— à des fins de test et d'évaluation de l'IA.</span>
  </div>
</footer>
