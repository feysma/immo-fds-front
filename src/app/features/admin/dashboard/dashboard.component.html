<div class="container-app py-8">

  <!-- En-tête de bienvenue -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-gray-900">
      Bonjour, {{ authService.currentUser()?.firstName }} 👋
    </h1>
    <p class="text-gray-500 mt-1 text-sm">Bienvenue dans l'espace d'administration ImmoFDS.</p>
  </div>

  <!-- Cards de navigation (stubs) -->
  <div class="grid-3-cols">

    <!-- Biens immobiliers -->
    <a
      routerLink="/admin/properties"
      class="card-nav group"
    >
      <div class="flex items-center gap-4 mb-4">
        <div class="w-10 h-10 rounded-lg bg-primary-100 flex items-center justify-center group-hover:bg-primary-200 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75" />
          </svg>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-gray-900">Biens immobiliers</h2>
          <p class="text-xs text-gray-400">Gérer les annonces</p>
        </div>
      </div>
      <span class="inline-flex items-center gap-1 text-xs text-primary-600 font-medium group-hover:gap-2 transition-all">
        Accéder
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
        </svg>
      </span>
    </a>

    <!-- Demandes de contact -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm hover:shadow-md transition-shadow cursor-not-allowed opacity-60">
      <div class="flex items-center gap-4 mb-4">
        <div class="w-10 h-10 rounded-lg bg-emerald-100 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
          </svg>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-gray-900">Contacts</h2>
          <p class="text-xs text-gray-400">Demandes reçues</p>
        </div>
      </div>
      <span class="inline-block text-xs bg-gray-100 text-gray-500 rounded-full px-2.5 py-0.5 font-medium">
        À venir
      </span>
    </div>

    <!-- Utilisateurs (SUPER_ADMIN only) -->
    @if (authService.currentUser()?.role === 'SUPER_ADMIN') {
      <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm hover:shadow-md transition-shadow cursor-not-allowed opacity-60">
        <div class="flex items-center gap-4 mb-4">
          <div class="w-10 h-10 rounded-lg bg-amber-100 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
            </svg>
          </div>
          <div>
            <h2 class="text-sm font-semibold text-gray-900">Utilisateurs</h2>
            <p class="text-xs text-gray-400">Gestion des accès</p>
          </div>
        </div>
        <span class="inline-block text-xs bg-gray-100 text-gray-500 rounded-full px-2.5 py-0.5 font-medium">
          À venir
        </span>
      </div>
    }

  </div>
</div>
