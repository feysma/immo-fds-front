<div class="min-h-screen bg-gray-100 flex flex-col">

  <!-- Header -->
  <header class="sticky-header flex-shrink-0">
    <div class="sticky-header__inner justify-between">

      <!-- Logo -->
      <div class="flex items-center gap-2">
        <span class="text-lg font-bold text-primary-700 tracking-tight">ImmoFDS</span>
        <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest border border-gray-200 rounded px-1.5 py-0.5">
          Admin
        </span>
      </div>

      <!-- User + logout -->
      <div class="flex items-center gap-3">
        @if (authService.currentUser(); as user) {
          <span class="text-sm text-gray-600 hidden sm:block">
            {{ user.firstName }} {{ user.lastName }}
          </span>
        }
        <button
          (click)="logout()"
          class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-red-600 font-medium transition-colors"
          title="Se déconnecter"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
          </svg>
          <span class="hidden sm:block">Déconnexion</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Contenu principal -->
  <main class="flex-1">
    <router-outlet />
  </main>

  <!-- Bandeau vibe coding -->
  <app-footer-public [showAdminLink]="false" />

</div>
